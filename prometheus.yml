global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mongo-exporter'
    static_configs:
      - targets: ['mongo-exporter:9216']

  - job_name: 'flask-webapp'
    static_configs:
      - targets: ['webapp:5000']
    metrics_path: '/metrics' 