version: '3.8'
services:
  mongodb:
    image: mongo:4.4
    container_name: my_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpass
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: adminpass
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
    ports:
      - "8081:8081"
    depends_on:
      - mongodb

  mongo-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongo_exporter
    command:
      - '--collect-all'
      - '--compatible-mode'
      - '--discovering-mode'
    environment:
      MONGODB_URI: mongodb://admin:adminpass@mongodb:27017/admin
    ports:
      - "9216:9216"
    depends_on:
      - mongodb

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: "65534:65534"
    ports:
      - "9090:9090"
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - mongo-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "472:472"
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      TZ: Asia/Jakarta
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: flask_webapp
    environment:
      - MONGO_URI=mongodb://admin:adminpass@192.168.11.12:27017/sample_mflix?authSource=admin
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    restart: always

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: flask_api
    environment:
      - MONGO_URI=mongodb://admin:adminpass@192.168.11.12:27017/sample_mflix?authSource=admin
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    restart: always

  krakend:
    image: devopsfaith/krakend:latest
    container_name: krakend_gateway
    ports:
      - "8888:8888"
    volumes:
      - ./krakend.json:/etc/krakend/krakend.json
    command:
      - run
      - -c
      - /etc/krakend/krakend.json
    depends_on:
      - api
    restart: always

  # locust:
  #   build:
  #     context: ./locust
  #     dockerfile: Dockerfile
  #   container_name: locust_loadtest
  #   ports:
  #     - "8089:8089"
  #   environment:
  #     - LOCUST_HOST=http://192.168.11.12:8888
  #   volumes:
  #     - ./locust:/app
  #   command: ["locust", "--host=http://192.168.11.12:8888", "--port=8089"]
  #   depends_on:
  #     - krakend
  #   restart: always

volumes:
  mongo-data:
  prometheus_data:
  grafana_data:
